<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECOMP.Global - Professional Electronic Components Supplier</title>
    <!-- 引入 Tailwind CSS (样式) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 React 和 ReactDOM (逻辑) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- 引入 Babel (解析 JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- 引入 Lucide 图标库 -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* 简单的淡入动画 */
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-gray-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- 数据层 ---
        const products = [
            { id: 1, mpn: 'STM32F103C8T6', brand: 'STMicroelectronics', category: 'mcu', desc: 'ARM Cortex-M3 32-bit MCU', pkg: 'LQFP-48', stock: 500, price: '$1.25', img: 'https://placehold.co/400x300/e2e8f0/1e293b?text=STM32' },
            { id: 2, mpn: 'LM358N', brand: 'Texas Instruments', category: 'ic', desc: 'Dual Op-Amp', pkg: 'DIP-8', stock: 1200, price: '$0.15', img: 'https://placehold.co/400x300/e2e8f0/1e293b?text=LM358' },
            { id: 3, mpn: 'GRM155R71C104KA93D', brand: 'Murata', category: 'passive', desc: '0402 MLCC 0.1uF', pkg: '0402', stock: 50000, price: '$0.002', img: 'https://placehold.co/400x300/e2e8f0/1e293b?text=Capacitor' },
            { id: 4, mpn: 'IRF540N', brand: 'Infineon', category: 'discrete', desc: 'N-Channel MOSFET', pkg: 'TO-220', stock: 800, price: '$0.85', img: 'https://placehold.co/400x300/e2e8f0/1e293b?text=MOSFET' },
        ];

        const translations = {
            en: {
                nav: { home: 'Home', products: 'Products', contact: 'Contact' },
                hero: { title: 'Global Electronic Components Supplier', subtitle: 'Original | Factory Price | Global Shipping', cta: 'Get Instant Quote' },
                products: { filter: 'Filter', search: 'Search MPN...', stock: 'Stock' },
                inquiry: { title: 'Request Quote', name: 'Full Name', email: 'Email', submit: 'Send Inquiry' }
            },
            es: {
                nav: { home: 'Inicio', products: 'Productos', contact: 'Contacto' },
                hero: { title: 'Proveedor Global de Componentes', subtitle: 'Original | Precio Fábrica | Envío Global', cta: 'Cotización Inmediata' },
                products: { filter: 'Filtrar', search: 'Buscar MPN...', stock: 'Stock' },
                inquiry: { title: 'Solicitar Cotización', name: 'Nombre Completo', email: 'Correo', submit: 'Enviar Consulta' }
            }
        };

        // --- 组件层 ---
        
        // 1. 导航栏
        const Header = ({ lang, setLang, setPage, onInquiry }) => {
            const t = translations[lang].nav;
            return (
                <header className="fixed w-full bg-white/95 backdrop-blur shadow-sm z-50">
                    <div className="container mx-auto px-4 h-16 flex items-center justify-between">
                        <div className="text-2xl font-bold text-slate-900 cursor-pointer" onClick={() => setPage('home')}>
                            ECOMP<span className="text-blue-700">.Global</span>
                        </div>
                        <nav className="hidden md:flex gap-6">
                            <button onClick={() => setPage('home')} className="hover:text-blue-600">{t.home}</button>
                            <button onClick={() => setPage('products')} className="hover:text-blue-600">{t.products}</button>
                        </nav>
                        <div className="flex items-center gap-4">
                            <select onChange={(e) => setLang(e.target.value)} value={lang} className="border rounded p-1 text-sm">
                                <option value="en">EN</option>
                                <option value="es">ES</option>
                            </select>
                            <button onClick={onInquiry} className="bg-blue-700 text-white px-4 py-2 rounded text-sm hover:bg-blue-800">
                                {translations[lang].hero.cta}
                            </button>
                        </div>
                    </div>
                </header>
            );
        };

        // 2. 首页 Hero 区域
        const Hero = ({ setPage, t }) => (
            <section className="pt-32 pb-20 bg-slate-900 text-white relative overflow-hidden">
                <div className="absolute inset-0 opacity-20 bg-[url('https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1920&q=80')] bg-cover bg-center"></div>
                <div className="container mx-auto px-4 relative z-10 text-center">
                    <h1 className="text-4xl md:text-6xl font-bold mb-6">{t.hero.title}</h1>
                    <p className="text-xl text-slate-300 mb-8">{t.hero.subtitle}</p>
                    <button onClick={() => setPage('products')} className="bg-blue-600 hover:bg-blue-700 px-8 py-3 rounded text-lg font-semibold transition">
                        {t.hero.cta}
                    </button>
                </div>
            </section>
        );

        // 3. 产品列表
        const ProductList = ({ products, t, onInquiry }) => {
            const [filter, setFilter] = useState('all');
            
            const filtered = filter === 'all' ? products : products.filter(p => p.category === filter);

            return (
                <section className="py-20 container mx-auto px-4">
                    <div className="flex flex-col md:flex-row justify-between mb-8 items-center">
                        <h2 className="text-3xl font-bold text-slate-900">{t.products.filter}</h2>
                        <div className="flex gap-2 mt-4 md:mt-0">
                            {['all', 'mcu', 'ic', 'passive', 'discrete'].map(cat => (
                                <button 
                                    key={cat}
                                    onClick={() => setFilter(cat)}
                                    className={`px-3 py-1 rounded-full text-sm border ${filter === cat ? 'bg-blue-700 text-white border-blue-700' : 'bg-white text-slate-600 hover:border-blue-300'}`}
                                >
                                    {cat === 'all' ? 'All' : cat.charAt(0).toUpperCase() + cat.slice(1)}
                                </button>
                            ))}
                        </div>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6">
                        {filtered.map(p => (
                            <div key={p.id} className="bg-white border rounded-lg overflow-hidden hover:shadow-lg transition group">
                                <div className="h-48 bg-gray-100 overflow-hidden">
                                    <img src={p.img} alt={p.mpn} className="w-full h-full object-cover group-hover:scale-105 transition" />
                                </div>
                                <div className="p-4">
                                    <div className="text-xs text-slate-500 mb-1">{p.brand}</div>
                                    <h3 className="font-bold text-slate-900">{p.mpn}</h3>
                                    <p className="text-sm text-slate-500 mb-4 line-clamp-2">{p.desc}</p>
                                    <div className="flex justify-between items-center pt-4 border-t">
                                        <span className="font-bold text-slate-700">{p.price}</span>
                                        <button onClick={() => onInquiry(p)} className="text-blue-600 text-sm font-medium hover:underline">
                                            Get Quote
                                        </button>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </section>
            );
        };

        // 4. 询盘弹窗
        const InquiryModal = ({ isOpen, onClose, product, t }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                    <div className="bg-white rounded-lg shadow-xl w-full max-w-md p-6 relative fade-in">
                        <button onClick={onClose} className="absolute top-4 right-4 text-gray-400 hover:text-gray-600">✕</button>
                        <h3 className="text-xl font-bold mb-4">{t.inquiry.title}</h3>
                        <form onSubmit={(e) => { e.preventDefault(); alert('Inquiry Sent!'); onClose(); }} className="space-y-4">
                            <input required type="text" placeholder={t.inquiry.name} className="w-full border p-2 rounded" />
                            <input required type="email" placeholder={t.inquiry.email} className="w-full border p-2 rounded" />
                            <input type="text" placeholder="Company Name" className="w-full border p-2 rounded" />
                            <input type="text" placeholder="Quantity" className="w-full border p-2 rounded" />
                            <textarea placeholder="Message" className="w-full border p-2 rounded" rows={3}></textarea>
                            <button type="submit" className="w-full bg-blue-700 text-white py-2 rounded hover:bg-blue-800">{t.inquiry.submit}</button>
                        </form>
                    </div>
                </div>
            );
        };

        // 5. 主应用入口
        const App = () => {
            const [page, setPage] = useState('home');
            const [lang, setLang] = useState('en');
            const [modalOpen, setModalOpen] = useState(false);
            const [selectedProduct, setSelectedProduct] = useState(null);

            const t = translations[lang];

            const handleInquiry = (product = null) => {
                setSelectedProduct(product);
                setModalOpen(true);
            };

            return (
                <div className="min-h-screen flex flex-col">
                    <Header lang={lang} setLang={setLang} setPage={setPage} onInquiry={() => handleInquiry(null)} />
                    
                    <main className="flex-grow">
                        {page === 'home' && (
                            <>
                                <Hero setPage={setPage} t={t} />
                                <div className="py-10 text-center">
                                    <h2 className="text-2xl font-bold mb-4">Featured Products</h2>
                                    <button onClick={() => setPage('products')} className="text-blue-600 hover:underline">View All →</button>
                                </div>
                                <ProductList products={products.slice(0, 2)} t={t} onInquiry={handleInquiry} />
                            </>
                        )}
                        {page === 'products' && <ProductList products={products} t={t} onInquiry={handleInquiry} />}
                    </main>

                    <footer className="bg-slate-900 text-slate-400 py-8 text-center text-sm">
                        <p>© 2026 ECOMP.Global. All rights reserved.</p>
                    </footer>

                    <InquiryModal isOpen={modalOpen} onClose={() => setModalOpen(false)} product={selectedProduct} t={t} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
