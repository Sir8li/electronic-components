<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 全球电子商城</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #00d4ff;
            --secondary: #00ff88;
            --bg: #0a0e1a;
            --card: #12182a;
            --border: #1e2a4a;
            --text: #fff;
            --text-secondary: #8892a8;
        }
        body {
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        .header {
            background: rgba(18, 24, 42, 0.9);
            padding: 15px 20px;
        }
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { font-size: 24px; font-weight: bold; color: var(--primary); }
        .nav a {
            color: var(--text-secondary);
            text-decoration: none;
            margin-left: 20px;
        }
        .nav a:hover { color: var(--primary); }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .admin-tabs { margin-bottom: 20px; }
        .admin-tab {
            padding: 10px 20px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            cursor: pointer;
            margin-right: 10px;
        }
        .admin-tab.active { background: var(--primary); color: #000; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .form-section {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .section-title { color: var(--primary); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label {
            display: block;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }
        .form-control {
            width: 100%;
            padding: 10px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-primary { background: var(--primary); color: #000; }
        .btn-secondary { background: var(--border); color: var(--text); }
        .products-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .product-item {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
        }
        .product-image { font-size: 32px; text-align: center; }
        .product-name { font-weight: 600; margin: 10px 0; }
        .product-price { color: var(--secondary); }
        textarea.form-control { min-height: 120px; }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">⚡ 管理后台</div>
            <div class="nav">
                <a href="index.html">首页</a>
                <a href="cart.html">购物车</a>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="admin-tabs">
            <button class="admin-tab active" data-tab="add">添加商品</button>
            <button class="admin-tab" data-tab="list">商品列表</button>
            <button class="admin-tab" data-tab="batch">批量上传</button>
        </div>

        <div class="tab-content active" id="add-tab">
            <div class="form-section">
                <h3 class="section-title">添加商品</h3>
                <div class="form-group">
                    <label>商品名称（中文）</label>
                    <input type="text" class="form-control" id="nameZh">
                </div>
                <div class="form-group">
                    <label>商品名称（英文）</label>
                    <input type="text" class="form-control" id="nameEn">
                </div>
                <div class="form-group">
                    <label>商品描述（中文）</label>
                    <textarea class="form-control" id="descZh" placeholder="请输入商品描述"></textarea>
                </div>
                <div class="form-group">
                    <label>商品描述（英文）</label>
                    <textarea class="form-control" id="descEn" placeholder="Please enter product description"></textarea>
                </div>
                <div class="form-group">
                    <label>商品图片（选择图标或导入外部图片）</label>
                    <div style="display: flex; flex-wrap: wrap; gap: 10px;" id="imageSelector">
                        <button type="button" onclick="selectImage('🔌')" style="width: 40px; height: 40px; font-size: 24px; background: var(--card); border: 2px solid var(--border); border-radius: 6px; cursor: pointer;">🔌</button>
                        <button type="button" onclick="selectImage('💡')" style="width: 40px; height: 40px; font-size: 24px; background: var(--card); border: 2px solid var(--border); border-radius: 6px; cursor: pointer;">💡</button>
                        <button type="button" onclick="selectImage('🔧')" style="width: 40px; height: 40px; font-size: 24px; background: var(--card); border: 2px solid var(--border); border-radius: 6px; cursor: pointer;">🔧</button>
                        <button type="button" onclick="selectImage('💻')" style="width: 40px; height: 40px; font-size: 24px; background: var(--card); border: 2px solid var(--border); border-radius: 6px; cursor: pointer;">💻</button>
                        <button type="button" onclick="selectImage('🔋')" style="width: 40px; height: 40px; font-size: 24px; background: var(--card); border: 2px solid var(--border); border-radius: 6px; cursor: pointer;">🔋</button>
                        <button type="button" onclick="selectImage('📡')" style="width: 40px; height: 40px; font-size: 24px; background: var(--card); border: 2px solid var(--border); border-radius: 6px; cursor: pointer;">📡</button>
                        <button type="button" onclick="selectImage('⚡')" style="width: 40px; height: 40px; font-size: 24px; background: var(--card); border: 2px solid var(--border); border-radius: 6px; cursor: pointer;">⚡</button>
                        <button type="button" onclick="selectImage('🔬')" style="width: 40px; height: 40px; font-size: 24px; background: var(--card); border: 2px solid var(--border); border-radius: 6px; cursor: pointer;">🔬</button>
                        <button type="button" onclick="selectImage('🔊')" style="width: 40px; height: 40px; font-size: 24px; background: var(--card); border: 2px solid var(--border); border-radius: 6px; cursor: pointer;">🔊</button>
                        <button type="button" onclick="selectImage('🎮')" style="width: 40px; height: 40px; font-size: 24px; background: var(--card); border: 2px solid var(--border); border-radius: 6px; cursor: pointer;">🎮</button>
                        <button type="button" onclick="selectImage('🔩')" style="width: 40px; height: 40px; font-size: 24px; background: var(--card); border: 2px solid var(--border); border-radius: 6px; cursor: pointer;">🔩</button>
                        <button type="button" onclick="selectImage('🛠️')" style="width: 40px; height: 40px; font-size: 24px; background: var(--card); border: 2px solid var(--border); border-radius: 6px; cursor: pointer;">🛠️</button>
                    </div>
                    <input type="text" class="form-control" id="productImage" readonly placeholder="点击上方图标选择或使用下方方式导入" style="margin-top: 10px;">
                    <div style="margin-top: 10px; display: flex; gap: 10px;">
                        <input type="text" class="form-control" id="imageUrl" placeholder="输入图片URL地址" style="flex: 1;">
                        <button class="btn btn-secondary" onclick="importImageUrl()">导入URL</button>
                    </div>
                    <div style="margin-top: 10px;">
                        <label style="display: block; margin-bottom: 5px;">或上传本地图片：</label>
                        <input type="file" accept="image/*" id="imageUpload" onchange="uploadImage()" style="display: none;">
                        <button class="btn btn-secondary" onclick="document.getElementById('imageUpload').click()">上传图片</button>
                        <span style="color: var(--text-secondary); font-size: 12px; margin-left: 10px;">支持 JPG、PNG、GIF 格式</span>
                    </div>
                    <div id="imagePreview" style="margin-top: 10px; max-width: 200px; display: none;">
                        <img id="previewImg" src="" style="max-width: 100%; border-radius: 4px;">
                    </div>
                </div>
                <div class="form-group">
                    <label>价格 ($)</label>
                    <input type="number" step="0.01" class="form-control" id="price">
                </div>
                <div class="form-group">
                    <label>原价 ($)</label>
                    <input type="number" step="0.01" class="form-control" id="originalPrice">
                </div>
                <div class="form-group">
                    <label>库存</label>
                    <input type="number" class="form-control" id="stock">
                </div>
                <div class="form-group">
                    <label>分类</label>
                    <select class="form-control" id="category">
                        <option value="connectors">连接器</option>
                        <option value="led">LED灯珠</option>
                        <option value="resistors">电阻</option>
                        <option value="ics">集成电路</option>
                        <option value="power">电源</option>
                        <option value="sensors">传感器</option>
                        <option value="relays">继电器</option>
                        <option value="devboards">开发板</option>
                    </select>
                </div>
                <button class="btn btn-primary" onclick="addProduct()">添加商品</button>
            </div>
        </div>

        <div class="tab-content" id="list-tab">
            <div class="products-list" id="productsList"></div>
        </div>

        <div class="tab-content" id="batch-tab">
            <div class="form-section">
                <h3 class="section-title">批量上传商品</h3>
                <p style="color: var(--text-secondary); margin-bottom: 20px;">支持淘宝、天猫、京东、1688等平台，每行一个链接</p>
                <textarea class="form-control" id="batchLinks" placeholder="https://item.taobao.com/item.htm?id=123456789&#10;https://item.jd.com/product/123456789.html"></textarea>
                <div style="margin-top: 20px;">
                    <button class="btn btn-primary" onclick="parseBatchLinks()">解析商品</button>
                    <button class="btn btn-secondary" onclick="clearBatchLinks()">清空</button>
                </div>
            </div>
            <div class="form-section" id="batchPreview" style="display: none;">
                <h3 class="section-title">商品预览（可编辑）</h3>
                <p style="color: var(--text-secondary); margin-bottom: 10px;">点击商品信息可修改，删除不需要的商品</p>
                <div id="batchGrid"></div>
                <div style="margin-top: 20px;">
                    <button class="btn btn-primary" onclick="saveBatchProducts()">保存到商城</button>
                </div>
            </div>
        </div>
    </div>

    <script src="products.js"></script>
    <script>
        document.querySelectorAll('.admin-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab + '-tab').classList.add('active');
            });
        });

        function selectImage(icon) {
            document.getElementById('productImage').value = icon;
            document.getElementById('imagePreview').style.display = 'none';
            document.getElementById('imageUrl').value = '';
        }

        function importImageUrl() {
            const url = document.getElementById('imageUrl').value.trim();
            if (!url) {
                alert('请输入图片URL地址');
                return;
            }
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                alert('请输入有效的URL地址（以http://或https://开头）');
                return;
            }
            document.getElementById('productImage').value = url;
            document.getElementById('previewImg').src = url;
            document.getElementById('imagePreview').style.display = 'block';
        }

        function uploadImage() {
            const fileInput = document.getElementById('imageUpload');
            if (!fileInput.files || fileInput.files.length === 0) {
                return;
            }
            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64 = e.target.result;
                document.getElementById('productImage').value = base64;
                document.getElementById('previewImg').src = base64;
                document.getElementById('imagePreview').style.display = 'block';
                document.getElementById('imageUrl').value = '';
            };
            reader.readAsDataURL(file);
        }

        function addProduct() {
            const nameZh = document.getElementById('nameZh').value;
            const nameEn = document.getElementById('nameEn').value;
            const descZh = document.getElementById('descZh').value || '高品质电子元件';
            const descEn = document.getElementById('descEn').value || 'High quality component';
            const image = document.getElementById('productImage').value || '🔌';
            const price = parseFloat(document.getElementById('price').value);
            const originalPrice = parseFloat(document.getElementById('originalPrice').value) || Math.round(price * 1.4 * 100) / 100;
            const stock = parseInt(document.getElementById('stock').value);
            const category = document.getElementById('category').value;
            
            if (!nameZh || !nameEn || isNaN(price) || isNaN(stock)) {
                alert('请填写完整的商品信息（名称、价格、库存）');
                return;
            }
            
            const product = {
                id: Date.now(),
                name: { zh: nameZh, en: nameEn },
                description: { zh: descZh, en: descEn },
                category: category,
                price: price,
                originalPrice: originalPrice,
                image: image,
                specs: { model: 'Custom' },
                tags: ['电子元件'],
                tagsEn: ['Electronic'],
                stock: stock,
                sales: 0,
                rating: 4.8
            };
            
            window.products.push(product);
            localStorage.setItem('products', JSON.stringify(window.products));
            alert('商品添加成功');
            
            document.getElementById('nameZh').value = '';
            document.getElementById('nameEn').value = '';
            document.getElementById('descZh').value = '';
            document.getElementById('descEn').value = '';
            document.getElementById('productImage').value = '';
            document.getElementById('price').value = '';
            document.getElementById('originalPrice').value = '';
            document.getElementById('stock').value = '';
            document.getElementById('category').value = 'connectors';
            
            renderProductList();
        }

        function renderProductList() {
            const list = document.getElementById('productsList');
            list.innerHTML = window.products.map(p => `
                <div class="product-item">
                    <div class="product-image">${p.image}</div>
                    <div class="product-name">${p.name.zh}</div>
                    <div class="product-price">$${p.price.toFixed(2)}</div>
                </div>
            `).join('');
        }

        let batchProducts = [];

        function parseBatchLinks() {
            const linksText = document.getElementById('batchLinks').value.trim();
            if (!linksText) { alert('请输入商品链接'); return; }
            
            const links = linksText.split('\n').filter(l => l.trim());
            if (links.length === 0) { alert('请输入有效的商品链接'); return; }
            
            batchProducts = [];
            
            links.forEach((link, index) => {
                link = link.trim();
                if (!link) return;
                
                try { link = decodeURIComponent(link); } catch (e) {}
                
                let id = null;
                const taobaoMatch = link.match(/[?&]id=(\d+)/);
                if (taobaoMatch) id = parseInt(taobaoMatch[1]);
                
                const jdMatch = link.match(/jd\.com\/(?:product\/)?(\d+)(?:\.html)?/);
                if (jdMatch && !id) id = parseInt(jdMatch[1]);
                
                const alibabaMatch = link.match(/1688\.com\/offer\/(\d+)/);
                if (alibabaMatch && !id) id = parseInt(alibabaMatch[1]);
                
                const alicdnMatch = link.match(/alicdn\.com\/.*?(\d{8,16})/);
                if (alicdnMatch && !id) id = parseInt(alicdnMatch[1]);
                
                const numMatch = link.match(/(\d{8,16})/);
                if (numMatch && !id) id = parseInt(numMatch[1]);
                
                if (id) {
                    if (window.products.find(p => p.id === id)) return;
                    
                    const names = ['USB数据线', 'LED灯珠', '贴片电阻', '开发板', '锂电池', '传感器', '继电器', 'WiFi模块'];
                    const icons = ['🔌', '💡', '🔧', '💻', '🔋', '📡', '⚡', '🔬'];
                    const cats = ['connectors', 'led', 'resistors', 'ics', 'power', 'sensors', 'relays', 'devboards'];
                    const idx = index % 8;
                    const price = Math.round((Math.random() * 20 + 2) * 100) / 100;
                    
                    batchProducts.push({
                        id: id,
                        name: { zh: names[idx] + ' #' + id, en: names[idx] + ' #' + id },
                        description: { zh: '高品质电子元件', en: 'High quality component' },
                        category: cats[idx],
                        price: price,
                        originalPrice: Math.round(price * 1.4 * 100) / 100,
                        image: icons[idx],
                        specs: { model: 'Model-' + id },
                        tags: ['电子元件'],
                        tagsEn: ['Electronic'],
                        stock: 500,
                        sales: 0,
                        rating: 4.8
                    });
                }
            });
            
            if (batchProducts.length === 0) {
                alert('未能解析到有效商品链接');
                return;
            }
            
            renderBatchPreview();
            document.getElementById('batchPreview').style.display = 'block';
        }

        function renderBatchPreview() {
            const grid = document.getElementById('batchGrid');
            grid.innerHTML = batchProducts.map((product, idx) => `
                <div class="product-item" style="margin-bottom: 15px;">
                    <button onclick="removeBatchProduct(${idx})" style="background: #ff4757; color: white; border: none; padding: 5px 10px; border-radius: 4px; margin-bottom: 10px;">删除</button>
                    <div class="product-image">${product.image}</div>
                    <div style="margin: 10px 0;">
                        <label style="display: block; color: #8892a8; font-size: 12px;">名称（中文）</label>
                        <input type="text" value="${product.name.zh}" onchange="updateBatchProduct(${idx}, 'name', 'zh', this.value)" class="form-control" style="margin-bottom: 5px;">
                        <label style="display: block; color: #8892a8; font-size: 12px;">名称（英文）</label>
                        <input type="text" value="${product.name.en}" onchange="updateBatchProduct(${idx}, 'name', 'en', this.value)" class="form-control" style="margin-bottom: 5px;">
                        <label style="display: block; color: #8892a8; font-size: 12px;">价格 ($)</label>
                        <input type="number" step="0.01" value="${product.price}" onchange="updateBatchProduct(${idx}, 'price', '', parseFloat(this.value))" class="form-control">
                    </div>
                </div>
            `).join('');
        }

        function updateBatchProduct(index, field, subField, value) {
            if (subField) batchProducts[index][field][subField] = value;
            else batchProducts[index][field] = value;
        }

        function removeBatchProduct(index) {
            batchProducts.splice(index, 1);
            if (batchProducts.length === 0) {
                document.getElementById('batchPreview').style.display = 'none';
            } else {
                renderBatchPreview();
            }
        }

        function saveBatchProducts() {
            if (batchProducts.length === 0) { alert('没有可保存的商品'); return; }
            
            let saved = 0;
            batchProducts.forEach(product => {
                if (!window.products.find(p => p.id === product.id)) {
                    window.products.push(product);
                    saved++;
                }
            });
            
            localStorage.setItem('products', JSON.stringify(window.products));
            document.getElementById('batchPreview').style.display = 'none';
            document.getElementById('batchLinks').value = '';
            batchProducts = [];
            
            alert('成功保存 ' + saved + ' 个商品');
            renderProductList();
        }

        function clearBatchLinks() {
            document.getElementById('batchLinks').value = '';
            document.getElementById('batchPreview').style.display = 'none';
            batchProducts = [];
        }

        renderProductList();
    </script>
</body>
</html>
