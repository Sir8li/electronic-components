<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全球电子商城</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #ff6600;
            --primary-light: #ff8533;
            --secondary: #ff9500;
            --bg: #f5f5f5;
            --card: #ffffff;
            --border: #e8e8e8;
            --text: #333333;
            --text-secondary: #666666;
            --text-light: #999999;
        }
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        .shop-banner {
            background: linear-gradient(135deg, #ff6600, #ff9500);
            padding: 30px 20px;
            text-align: center;
        }
        .shop-name {
            font-size: 32px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 10px;
        }
        .shop-desc {
            color: rgba(255,255,255,0.9);
            font-size: 16px;
        }
        .header {
            background: var(--card);
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary);
        }
        .nav {
            display: flex;
            gap: 20px;
        }
        .nav a {
            color: var(--text);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 20px;
            transition: all 0.3s;
        }
        .nav a:hover, .nav a.active { 
            background: var(--primary);
            color: #fff;
        }
        .lang-switch {
            padding: 8px 16px;
            background: var(--primary);
            border: none;
            border-radius: 20px;
            color: #fff;
            cursor: pointer;
            font-weight: 600;
        }
        .hero {
            background: linear-gradient(135deg, #fff5f0, #fff);
            padding: 40px 20px;
            text-align: center;
        }
        .hero h1 { 
            font-size: 36px; 
            margin-bottom: 10px;
            color: var(--primary);
        }
        .hero p { 
            color: var(--text-secondary); 
            font-size: 16px;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .categories { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 30px; 
            overflow-x: auto;
            padding: 10px 0;
        }
        .cat-btn {
            padding: 10px 20px;
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 25px;
            color: var(--text);
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
            white-space: nowrap;
        }
        .cat-btn:hover, .cat-btn.active { 
            background: var(--primary); 
            color: #fff;
            border-color: var(--primary);
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }
        .product-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            transition: all 0.3s;
            position: relative;
        }
        .product-card:hover { 
            transform: translateY(-3px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            border-color: var(--primary);
        }
        .product-image { 
            font-size: 60px; 
            text-align: center; 
            margin-bottom: 15px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .product-name { 
            font-weight: 600; 
            margin-bottom: 8px;
            font-size: 15px;
            line-height: 1.4;
            height: 42px;
            overflow: hidden;
        }
        .product-desc { 
            color: var(--text-secondary); 
            font-size: 12px; 
            margin-bottom: 10px;
            line-height: 1.5;
        }
        .product-price-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 10px;
        }
        .product-price { 
            color: var(--primary); 
            font-size: 22px; 
            font-weight: bold;
        }
        .product-original-price {
            color: var(--text-light);
            font-size: 14px;
            text-decoration: line-through;
        }
        .product-sales {
            color: var(--text-light);
            font-size: 12px;
        }
        .add-btn {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 20px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .add-btn:hover {
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            transform: scale(1.02);
        }
        .quantity-selector {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 10px 0;
        }
        .qty-btn {
            width: 30px;
            height: 30px;
            border: 1px solid var(--border);
            background: var(--card);
            border-radius: 4px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .qty-btn:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .qty-input {
            width: 50px;
            height: 30px;
            text-align: center;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 14px;
        }
        .cart-count {
            background: var(--primary);
            color: #fff;
            border-radius: 50%;
            padding: 2px 8px;
            font-size: 12px;
            margin-left: 5px;
        }
        .stock-status {
            font-size: 12px;
            color: var(--text-light);
            margin-bottom: 5px;
        }
        .stock-status.good { color: #4caf50; }
        .stock-status.low { color: #ff9800; }
        .stock-status.out { color: #f44336; }
        .footer {
            background: var(--card);
            padding: 30px 20px;
            text-align: center;
            color: var(--text-secondary);
            border-top: 1px solid var(--border);
            margin-top: 40px;
        }
        @media (max-width: 768px) {
            .products-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .product-image {
                font-size: 40px;
                height: 80px;
            }
            .shop-name {
                font-size: 24px;
            }
            .hero h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <!-- 店铺招牌 -->
    <div class="shop-banner">
        <div class="shop-name">⚡ 全球电子商城</div>
        <div class="shop-desc">专业电子元件供应商 | 品质保证 | 全球配送</div>
    </div>
    
    <header class="header">
        <div class="header-content">
            <div class="logo">⚡ 全球电子商城</div>
            <div class="nav">
                <a href="index.html" class="active">首页</a>
                <a href="admin.html">管理后台</a>
                <a href="cart.html">购物车<span class="cart-count" id="cartCount">0</span></a>
                <button class="lang-switch" id="langBtn" onclick="toggleLang()">English</button>
            </div>
        </div>
    </header>

    <section class="hero">
        <h1>全球电子商城</h1>
        <p>高品质电子元件，全球配送</p>
    </section>

    <div class="container">
        <div class="categories" id="categories"></div>
        <div class="products-grid" id="productsGrid"></div>
    </div>

    <footer class="footer">© 2024 Global Electronics Store</footer>

    <script>
        // 内嵌商品数据（避免外部文件缓存问题）
        window.products = [
            { id: 1, name: { zh: 'USB Type-C 数据线', en: 'USB Type-C Data Cable' }, description: { zh: '高品质USB-C数据线，支持快充', en: 'High quality USB-C cable with fast charging' }, category: 'connectors', price: 3.90, originalPrice: 5.50, image: '🔌', specs: { type: 'USB-C', length: '1m' }, tags: ['快充', '数据线'], tagsEn: ['Fast Charge', 'Data Cable'], stock: 1000, sales: 120, rating: 4.8 },
            { id: 2, name: { zh: 'LED灯珠 5mm', en: 'LED Diode 5mm' }, description: { zh: '高亮LED灯珠，多种颜色可选', en: 'High brightness LED diode' }, category: 'led', price: 0.50, originalPrice: 0.80, image: '💡', specs: { color: 'White', voltage: '3.2V' }, tags: ['LED', '灯珠'], tagsEn: ['LED', 'Diode'], stock: 5000, sales: 350, rating: 4.6 },
            { id: 3, name: { zh: '贴片电阻 1kΩ', en: 'SMD Resistor 1kΩ' }, description: { zh: '高精度贴片电阻，5%公差', en: 'High precision SMD resistor' }, category: 'resistors', price: 0.10, originalPrice: 0.15, image: '🔧', specs: { value: '1kΩ', package: '0805' }, tags: ['电阻', '贴片'], tagsEn: ['Resistor', 'SMD'], stock: 10000, sales: 890, rating: 4.9 },
            { id: 4, name: { zh: 'Arduino开发板', en: 'Arduino Board' }, description: { zh: '开源电子原型平台，适合学习', en: 'Open source electronics prototyping platform' }, category: 'ics', price: 25.00, originalPrice: 35.00, image: '💻', specs: { model: 'Uno R3', MCU: 'ATmega328P' }, tags: ['开发板', 'Arduino'], tagsEn: ['Development Board', 'Arduino'], stock: 200, sales: 45, rating: 4.7 },
            { id: 5, name: { zh: '锂电池 18650', en: 'Li-ion Battery 18650' }, description: { zh: '高性能锂离子电池，3.7V', en: 'High performance Li-ion battery' }, category: 'power', price: 8.50, originalPrice: 12.00, image: '🔋', specs: { capacity: '2600mAh', voltage: '3.7V' }, tags: ['电池', '18650'], tagsEn: ['Battery', '18650'], stock: 500, sales: 180, rating: 4.5 },
            { id: 6, name: { zh: 'HC-SR04超声波传感器', en: 'HC-SR04 Sensor' }, description: { zh: '超声波测距模块，2-400cm量程', en: 'Ultrasonic distance sensor module' }, category: 'sensors', price: 6.80, originalPrice: 9.50, image: '📡', specs: { range: '2-400cm', voltage: '5V' }, tags: ['传感器', '超声波'], tagsEn: ['Sensor', 'Ultrasonic'], stock: 300, sales: 78, rating: 4.6 },
            { id: 7, name: { zh: '继电器模块 5V', en: 'Relay Module 5V' }, description: { zh: '1路继电器模块，支持高低电平触发', en: '1-channel relay module' }, category: 'relays', price: 4.50, originalPrice: 6.50, image: '⚡', specs: { channels: '1', voltage: '5V' }, tags: ['继电器', '控制'], tagsEn: ['Relay', 'Control'], stock: 400, sales: 120, rating: 4.7 },
            { id: 8, name: { zh: 'ESP8266 WiFi模块', en: 'ESP8266 WiFi Module' }, description: { zh: 'WiFi通信模块，支持串口透传', en: 'WiFi communication module' }, category: 'devboards', price: 12.00, originalPrice: 18.00, image: '🔬', specs: { model: 'ESP-01', protocol: '802.11b/g/n' }, tags: ['WiFi', '模块'], tagsEn: ['WiFi', 'Module'], stock: 250, sales: 67, rating: 4.8 }
        ];
        
        window.categories = [
            { id: 'all', name: { zh: '全部商品', en: 'All Products' }, count: 8 },
            { id: 'connectors', name: { zh: '连接器', en: 'Connectors' }, count: 1 },
            { id: 'led', name: { zh: 'LED', en: 'LED' }, count: 1 },
            { id: 'resistors', name: { zh: '电阻', en: 'Resistors' }, count: 1 },
            { id: 'ics', name: { zh: '开发板', en: 'ICs & Boards' }, count: 1 },
            { id: 'power', name: { zh: '电源', en: 'Power' }, count: 1 },
            { id: 'sensors', name: { zh: '传感器', en: 'Sensors' }, count: 1 },
            { id: 'relays', name: { zh: '继电器', en: 'Relays' }, count: 1 },
            { id: 'devboards', name: { zh: '模块', en: 'Modules' }, count: 1 }
        ];
        
        window.cart = [];
    </script>
    <script>
        let lang = 'zh';

        function toggleLang() {
            lang = lang === 'zh' ? 'en' : 'zh';
            localStorage.setItem('language', lang);
            updateAllText();
        }

        function updateAllText() {
            document.getElementById('langBtn').textContent = lang === 'zh' ? 'English' : '中文';
            document.querySelector('.logo').textContent = lang === 'zh' ? '⚡ 全球电子商城' : '⚡ Global Electronics';
            document.querySelector('.hero h1').textContent = lang === 'zh' ? '全球电子商城' : 'Global Electronics Store';
            document.querySelector('.hero p').textContent = lang === 'zh' ? '高品质电子元件，全球配送' : 'High quality electronic components, worldwide shipping';
            document.querySelector('.footer').textContent = lang === 'zh' ? '© 2024 全球电子商城' : '© 2024 Global Electronics Store';
            
            document.querySelectorAll('.nav a')[0].textContent = lang === 'zh' ? '首页' : 'Home';
            document.querySelectorAll('.nav a')[1].textContent = lang === 'zh' ? '管理后台' : 'Admin';
            document.querySelectorAll('.nav a')[2].innerHTML = (lang === 'zh' ? '购物车' : 'Cart') + '<span class="cart-count" id="cartCount">' + document.getElementById('cartCount').textContent + '</span>';
            
            renderCategories();
            renderProducts();
        }

        function renderCategories() {
            const container = document.getElementById('categories');
            container.innerHTML = window.categories.map(cat => 
                `<button class="cat-btn ${cat.id === 'all' ? 'active' : ''}" onclick="filterProducts('${cat.id}')">${cat.name[lang]}</button>`
            ).join('');
        }

        function filterProducts(catId) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            renderProducts(catId);
        }

        function renderProducts(filterCat = 'all') {
            const grid = document.getElementById('productsGrid');
            const filtered = filterCat === 'all' ? window.products : window.products.filter(p => p.category === filterCat);
            grid.innerHTML = filtered.map(product => {
                const stockClass = product.stock > 100 ? 'stock-status good' : product.stock > 0 ? 'stock-status low' : 'stock-status out';
                const stockText = product.stock > 100 ? (lang === 'zh' ? '库存充足' : 'In Stock') : product.stock > 0 ? (lang === 'zh' ? `仅剩${product.stock}件` : `Only ${product.stock} left`) : (lang === 'zh' ? '缺货' : 'Out of Stock');
                const discount = product.originalPrice ? Math.round((1 - product.price / product.originalPrice) * 100) : 0;
                return `
                    <div class="product-card">
                        <div class="product-image">${product.image}</div>
                        <div class="product-name">${product.name[lang]}</div>
                        <div class="product-desc">${product.description[lang]}</div>
                        <div class="${stockClass}">${stockText}</div>
                        <div class="product-price-row">
                            <span class="product-price">¥${product.price.toFixed(2)}</span>
                            ${product.originalPrice ? `<span class="product-original-price">¥${product.originalPrice.toFixed(2)}</span>` : ''}
                            ${discount > 0 ? `<span style="color: #ff4757; font-size: 12px; margin-left: 5px;">省${discount}%</span>` : ''}
                        </div>
                        <div style="color: var(--text-light); font-size: 12px; margin-bottom: 10px;">
                            ${lang === 'zh' ? '已售' : 'Sold'} ${product.sales || 0}
                        </div>
                        <div class="quantity-selector">
                            <button class="qty-btn" onclick="updateQty(${product.id}, -1)">-</button>
                            <input type="number" class="qty-input" id="qty-${product.id}" value="1" min="1" max="${product.stock}">
                            <button class="qty-btn" onclick="updateQty(${product.id}, 1)">+</button>
                        </div>
                        <button class="add-btn" id="add-btn-${product.id}" onclick="addToCart(${product.id})">
                            <span class="cart-icon">🛒</span>
                            <span>${lang === 'zh' ? '加入购物车' : 'Add to Cart'}</span>
                        </button>
                    </div>
                `;
            }).join('');
        }

        function updateQty(productId, delta) {
            const input = document.getElementById(`qty-${productId}`);
            const product = window.products.find(p => p.id === productId);
            if (input && product) {
                let value = parseInt(input.value) || 1;
                value += delta;
                if (value < 1) value = 1;
                if (value > product.stock) value = product.stock;
                input.value = value;
            }
        }

        function addToCart(productId) {
            const product = window.products.find(p => p.id === productId);
            const qtyInput = document.getElementById(`qty-${productId}`);
            const addBtn = document.getElementById(`add-btn-${productId}`);
            
            const quantity = parseInt(qtyInput?.value) || 1;
            
            const cartItem = window.cart.find(c => c.id === productId);
            if (cartItem) {
                cartItem.quantity += quantity;
            } else {
                window.cart.push({ ...product, quantity: quantity });
            }
            
            localStorage.setItem('cart', JSON.stringify(window.cart));
            updateCartCount();
            
            // 添加明显的按钮动画反馈
            if (addBtn) {
                // 添加 added 类触发动画
                addBtn.classList.add('added');
                addBtn.innerHTML = `
                    <span class="cart-icon">✓</span>
                    <span>${lang === 'zh' ? '已加入购物车' : 'Added to Cart'}</span>
                `;
                
                // 创建弹出动画效果
                const floatIcon = document.createElement('span');
                floatIcon.innerHTML = '🛒';
                floatIcon.style.cssText = `
                    position: fixed;
                    font-size: 24px;
                    pointer-events: none;
                    z-index: 9999;
                    animation: floatToCart 1s ease-in forwards;
                `;
                
                const btnRect = addBtn.getBoundingClientRect();
                const cartIcon = document.querySelector('.cart-count');
                const cartRect = cartIcon.getBoundingClientRect();
                
                floatIcon.style.left = btnRect.left + btnRect.width / 2 + 'px';
                floatIcon.style.top = btnRect.top + 'px';
                
                // 添加关键帧动画样式
                const styleSheet = document.createElement('style');
                styleSheet.textContent = `
                    @keyframes floatToCart {
                        0% {
                            transform: translate(-50%, 0) scale(1);
                            opacity: 1;
                        }
                        50% {
                            transform: translate(-50%, -80px) scale(1.2);
                            opacity: 0.8;
                        }
                        100% {
                            transform: translate(${cartRect.left - btnRect.left + cartRect.width / 2 - 12}px, ${cartRect.top - btnRect.top}px) scale(0.5);
                            opacity: 0;
                        }
                    }
                `;
                document.head.appendChild(styleSheet);
                
                document.body.appendChild(floatIcon);
                
                // 重置按钮状态
                setTimeout(() => {
                    addBtn.classList.remove('added');
                    addBtn.innerHTML = `
                        <span class="cart-icon">🛒</span>
                        <span>${lang === 'zh' ? '加入购物车' : 'Add to Cart'}</span>
                    `;
                    floatIcon.remove();
                    styleSheet.remove();
                }, 1500);
            }
            
            // 重置数量为1
            if (qtyInput) qtyInput.value = 1;
        }

        function updateCartCount() {
            const count = window.cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cartCount').textContent = count;
        }

        const savedLang = localStorage.getItem('language');
        if (savedLang) lang = savedLang;
        const savedCart = localStorage.getItem('cart');
        if (savedCart) window.cart = JSON.parse(savedCart);
        updateCartCount();
        updateAllText();
    </script>
</body>
</html>
