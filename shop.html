<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全球电子商城</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #ff6600;
            --primary-light: #ff8533;
            --secondary: #ff9500;
            --bg: #f5f5f5;
            --card: #ffffff;
            --border: #e8e8e8;
            --text: #333333;
            --text-secondary: #666666;
            --text-light: #999999;
        }
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* 顶部导航 */
        .top-bar {
            background: #fff;
            border-bottom: 1px solid var(--border);
            padding: 10px 0;
        }
        .top-bar-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .top-bar a {
            color: var(--text-secondary);
            text-decoration: none;
            margin-left: 15px;
        }
        .top-bar a:hover {
            color: var(--primary);
        }

        /* 主导航 */
        .header {
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 26px;
            font-weight: bold;
            color: var(--primary);
            text-decoration: none;
        }
        .nav {
            display: flex;
            gap: 30px;
            align-items: center;
        }
        .nav a {
            color: var(--text);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            padding: 8px 0;
            position: relative;
            transition: color 0.3s;
        }
        .nav a:hover, .nav a.active {
            color: var(--primary);
        }
        .nav a.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--primary);
        }
        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg);
            border-radius: 20px;
            padding: 8px 15px;
            border: 1px solid var(--border);
        }
        .search-box input {
            border: none;
            background: transparent;
            outline: none;
            padding: 0 10px;
            font-size: 14px;
            width: 200px;
        }
        .search-box button {
            background: var(--primary);
            border: none;
            color: #fff;
            padding: 6px 15px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 14px;
        }
        .cart-icon {
            position: relative;
            font-size: 22px;
            cursor: pointer;
        }
        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--primary);
            color: #fff;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
        }

        /* 轮播图 */
        .banner {
            background: linear-gradient(135deg, #ff6600, #ff9500);
            padding: 50px 20px;
            text-align: center;
            color: #fff;
        }
        .banner h1 {
            font-size: 42px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .banner p {
            font-size: 18px;
            opacity: 0.9;
        }

        /* 分类区域 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        .section-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
            padding-left: 12px;
            border-left: 4px solid var(--primary);
        }
        .categories-row {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .categories-sub-row {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            padding-top: 15px;
            border-top: 1px solid var(--border);
        }
        .cat-label {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 10px;
            font-weight: 500;
            min-width: 60px;
        }
        .cat-btn {
            padding: 10px 22px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            color: var(--text);
        }
        .cat-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        .cat-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .cat-btn.sub {
            padding: 8px 18px;
            font-size: 13px;
            background: var(--bg);
        }

        /* 商品网格 */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s;
            border: 1px solid var(--border);
            cursor: pointer;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.1);
        }
        .product-image {
            width: 100%;
            height: 200px;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            position: relative;
            overflow: hidden;
        }
        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .product-image-fallback {
            display: flex;
            width: 100%;
            height: 100%;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            background: linear-gradient(135deg, #f5f5f5, #e8e8e8);
        }
        .product-info {
            padding: 15px;
        }
        .product-name {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 8px;
            line-height: 1.4;
            height: 42px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .product-desc {
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 10px;
            line-height: 1.5;
            height: 39px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .product-price-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 8px;
        }
        .product-price {
            color: #ff4757;
            font-size: 24px;
            font-weight: bold;
        }
        .product-original-price {
            color: var(--text-light);
            font-size: 14px;
            text-decoration: line-through;
        }
        .product-sales {
            color: var(--text-light);
            font-size: 12px;
        }
        .add-cart-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }
        .add-cart-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 12px rgba(255,102,0,0.3);
        }

        /* 登录弹窗 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: #fff;
            border-radius: 16px;
            width: 420px;
            max-width: 90%;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: modalSlideIn 0.3s ease;
        }
        @keyframes modalSlideIn {
            from {
                transform: translateY(-30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .modal-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            padding: 25px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h2 {
            font-size: 20px;
            font-weight: bold;
        }
        .modal-close {
            background: rgba(255,255,255,0.2);
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-body {
            padding: 40px 30px;
            text-align: center;
        }
        .qr-code {
            width: 200px;
            height: 200px;
            margin: 0 auto 20px;
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            font-size: 14px;
            color: var(--text-light);
        }
        .qr-code img {
            width: 100%;
            height: 100%;
        }
        .modal-tips {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 20px;
        }
        .login-methods {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }
        .login-btn {
            padding: 10px 25px;
            border-radius: 25px;
            border: 1px solid var(--border);
            background: #fff;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .login-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        .login-btn.primary {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .login-btn.primary:hover {
            background: var(--primary-light);
        }

        /* 页脚 */
        .footer {
            background: #2c3e50;
            color: #ecf0f1;
            padding: 50px 20px 30px;
            margin-top: 60px;
        }
        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 40px;
        }
        .footer-section h3 {
            margin-bottom: 15px;
            font-size: 16px;
        }
        .footer-section a {
            display: block;
            color: #bdc3c7;
            text-decoration: none;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .footer-section a:hover {
            color: var(--primary);
        }
        .footer-bottom {
            max-width: 1200px;
            margin: 30px auto 0;
            padding-top: 20px;
            border-top: 1px solid #34495e;
            text-align: center;
            font-size: 13px;
            color: #95a5a6;
        }

        @media (max-width: 768px) {
            .products-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .banner h1 {
                font-size: 28px;
            }
            .nav {
                gap: 15px;
            }
            .search-box {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部栏 -->
    <div class="top-bar">
        <div class="top-bar-content">
            <div>欢迎来到全球电子商城 | 专业电子元件供应商</div>
            <div>
                <a href="#" onclick="showLoginModal()">登录</a>
                <a href="#" onclick="showLoginModal()">注册</a>
                <a href="cart.html">帮助中心</a>
            </div>
        </div>
    </div>

    <!-- 主导航 -->
    <header class="header">
        <div class="header-content">
            <a href="shop.html" class="logo">⚡ 全球电子商城</a>
            <div class="nav">
                <a href="shop.html" class="active">首页</a>
                <a href="admin.html">管理后台</a>
                <div class="cart-icon" onclick="location.href='cart.html'">
                    🛒
                    <span class="cart-count" id="cartCount">0</span>
                </div>
            </div>
        </div>
    </header>

    <!-- 轮播图 -->
    <div class="banner">
        <h1>全球电子商城</h1>
        <p>高品质电子元件 · 专业品质保证 · 全球配送服务</p>
    </div>

    <!-- 主要内容 -->
    <div class="container">
        <div class="cat-label" id="catLabelMain">全部商品</div>
        <div class="categories-row" id="categories"></div>
        <div class="cat-label" id="catLabelSub" style="display:none;">细分分类</div>
        <div class="categories-sub-row" id="categoriesSub"></div>
        <div class="products-grid" id="productsGrid"></div>
    </div>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-section">
                <h3>关于我们</h3>
                <a href="#">公司简介</a>
                <a href="#">联系我们</a>
                <a href="#">加入我们</a>
            </div>
            <div class="footer-section">
                <h3>客户服务</h3>
                <a href="#">帮助中心</a>
                <a href="#">售后服务</a>
                <a href="#">配送说明</a>
            </div>
            <div class="footer-section">
                <h3>合作伙伴</h3>
                <a href="#">供应商入驻</a>
                <a href="#">企业合作</a>
                <a href="#">批发采购</a>
            </div>
            <div class="footer-section">
                <h3>关注我们</h3>
                <a href="#">微信公众号</a>
                <a href="#">官方微博</a>
                <a href="#">技术支持</a>
            </div>
        </div>
        <div class="footer-bottom">
            © 2024 全球电子商城 All Rights Reserved
        </div>
    </footer>

    <!-- 登录弹窗 -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal">
            <div class="modal-header">
                <h2>用户登录</h2>
                <button class="modal-close" onclick="closeLoginModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="qr-code">
                    <div>
                        <div style="font-size:60px;margin-bottom:10px;">📱</div>
                        <div>微信扫码登录</div>
                    </div>
                </div>
                <p class="modal-tips">请使用手机微信扫码登录</p>
                <div class="login-methods">
                    <button class="login-btn primary" onclick="alert('暂仅支持微信扫码登录')">微信登录</button>
                    <button class="login-btn" onclick="alert('手机号登录功能开发中')">手机号登录</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.products = [];
        window.categories = [];
        window.subCategories = [];
        window.cart = [];
        window.wordpressUrl = 'http://my-ecommerce-site.local';
        window.selectedMainCat = 'all';
        window.selectedSubCat = 'all';

        async function fetchProductsFromWordPress() {
            try {
                let allProducts = [];
                let page = 1;
                let hasMore = true;
                while (hasMore) {
                    const response = await fetch(`${window.wordpressUrl}/wp-json/wc/v3/products?consumer_key=ck_f955c3a57d5571004ec373ff07b0459469b2d41c&consumer_secret=cs_46b5caa0ee02e389a4875d2d05f3be6a0671b5cc&per_page=100&page=${page}`);
                    if (response.ok) {
                        const data = await response.json();
                        if (data.length > 0) {
                            allProducts = allProducts.concat(data);
                            page++;
                        } else {
                            hasMore = false;
                        }
                    } else {
                        hasMore = false;
                    }
                }
                window.products = allProducts.map(p => ({
                    id: p.id,
                    name: p.name,
                    description: p.short_description || p.description || '',
                    categories: p.categories || [],
                    price: parseFloat(p.regular_price) || 0,
                    originalPrice: parseFloat(p.sale_price) || null,
                    image: p.images && p.images[0] ? p.images[0].src : '',
                    stock: parseInt(p.manage_stock) ? p.stock_quantity : p.stock_status === 'instock' ? 999 : 0,
                    sales: 0,
                    rating: 4.5
                }));
                await fetchCategories();
                buildCategoryTree();
            } catch (error) {
                console.error('获取商品失败:', error);
                window.categories.push({ id: 'all', name: '全部商品', count: window.products.length });
            }
        }

        async function fetchCategories() {
            try {
                const response = await fetch(`${window.wordpressUrl}/wp-json/wc/v3/products/categories?consumer_key=ck_f955c3a57d5571004ec373ff07b0459469b2d41c&consumer_secret=cs_46b5caa0ee02e389a4875d2d05f3be6a0671b5cc&per_page=100`);
                if (response.ok) {
                    window.wooCategories = await response.json();
                }
            } catch (error) {
                console.error('获取分类失败:', error);
                window.wooCategories = [];
            }
        }

        function buildCategoryTree() {
            const mainCats = {};
            window.wooCategories.forEach(cat => {
                if (cat.parent === 0) {
                    if (!mainCats[cat.id]) {
                        mainCats[cat.id] = { id: cat.id, name: cat.name, count: 0, subs: [] };
                    }
                } else {
                    if (!mainCats[cat.parent]) {
                        mainCats[cat.parent] = {
                            id: cat.parent,
                            name: window.wooCategories.find(c => c.id === cat.parent)?.name || '未知',
                            count: 0,
                            subs: []
                        };
                    }
                    mainCats[cat.parent].subs.push({ id: cat.id, name: cat.name, parentId: cat.parent });
                }
            });
            window.products.forEach(p => {
                p.categories.forEach(cat => {
                    if (mainCats[cat.term_id]) {
                        mainCats[cat.term_id].count++;
                        const sub = mainCats[cat.term_id].subs.find(s => s.id === cat.term_id);
                        if (sub) sub.count = (sub.count || 0) + 1;
                    }
                });
            });
            window.categories = [];
            window.subCategories = [];
            Object.values(mainCats).forEach(main => {
                window.categories.push({
                    id: main.id,
                    name: main.name,
                    count: main.count + main.subs.reduce((sum, s) => sum + (s.count || 0), 0),
                    subs: main.subs
                });
            });
            window.categories.unshift({ id: 'all', name: '全部商品', count: window.products.length });
        }

        function renderCategories() {
            const container = document.getElementById('categories');
            const subContainer = document.getElementById('categoriesSub');
            const labelSub = document.getElementById('catLabelSub');
            container.innerHTML = window.categories.map(cat =>
                `<button class="cat-btn ${cat.id === window.selectedMainCat ? 'active' : ''}" onclick="selectMainCategory(${cat.id})">${cat.name}</button>`
            ).join('');
            const selectedMain = window.categories.find(c => c.id === window.selectedMainCat);
            if (selectedMain && selectedMain.subs && selectedMain.subs.length > 0) {
                labelSub.style.display = 'block';
                subContainer.innerHTML = `
                    <button class="cat-btn sub ${window.selectedSubCat === 'all' ? 'active' : ''}" onclick="selectSubCategory('all')">全部</button>
                    ${selectedMain.subs.map(sub =>
                        `<button class="cat-btn sub ${sub.id === window.selectedSubCat ? 'active' : ''}" onclick="selectSubCategory(${sub.id})">${sub.name}</button>`
                    ).join('')}
                `;
            } else {
                labelSub.style.display = 'none';
                subContainer.innerHTML = '';
            }
        }

        function selectMainCategory(catId) {
            window.selectedMainCat = catId;
            window.selectedSubCat = 'all';
            renderCategories();
            renderProducts();
        }

        function selectSubCategory(catId) {
            window.selectedSubCat = catId;
            renderCategories();
            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            let filtered = window.products;
            if (window.selectedMainCat !== 'all') {
                if (window.selectedSubCat !== 'all') {
                    filtered = filtered.filter(p => p.categories.some(c => c.term_id === window.selectedSubCat));
                } else {
                    filtered = filtered.filter(p => p.categories.some(c => c.term_id === window.selectedMainCat || p.categories.some(sc => sc.parent === window.selectedMainCat)));
                }
            }
            grid.innerHTML = filtered.map(product => {
                const discount = product.originalPrice ? Math.round((1 - product.price / product.originalPrice) * 100) : 0;
                const imageContent = product.image ? `<img src="${product.image}" alt="${product.name}" onerror="this.style.display='none';this.parentElement.querySelector('.product-image-fallback').style.display='flex';">` : '';
                return `
                    <div class="product-card">
                        <div class="product-image" style="position:relative;">
                            ${imageContent}
                            <div class="product-image-fallback" style="display:${product.image ? 'none' : 'flex'};background:linear-gradient(135deg,#f5f5f5,#e8e8e8);">📦</div>
                        </div>
                        <div class="product-info">
                            <div class="product-name">${product.name}</div>
                            <div class="product-desc">${product.description}</div>
                            <div class="product-price-row">
                                <span class="product-price">¥${product.price.toFixed(2)}</span>
                                ${product.originalPrice ? `<span class="product-original-price">¥${product.originalPrice.toFixed(2)}</span>` : ''}
                                ${discount > 0 ? `<span style="color:#ff4757;font-size:12px;margin-left:5px;">省${discount}%</span>` : ''}
                            </div>
                            <button class="add-cart-btn" onclick="addToCart(${product.id})">加入购物车</button>
                        </div>
                    </div>
                `;
            }).join('');
            if (filtered.length === 0) {
                grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:60px;color:#999;font-size:16px;">暂无商品</div>`;
            }
        }

        function addToCart(productId) {
            const product = window.products.find(p => p.id === productId);
            const existing = window.cart.find(c => c.id === productId);
            if (existing) {
                existing.quantity++;
            } else {
                window.cart.push({ ...product, quantity: 1 });
            }
            localStorage.setItem('cart', JSON.stringify(window.cart));
            updateCartCount();
        }

        function updateCartCount() {
            const count = window.cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cartCount').textContent = count;
        }

        function showLoginModal() {
            document.getElementById('loginModal').classList.add('active');
        }

        function closeLoginModal() {
            document.getElementById('loginModal').classList.remove('active');
        }

        document.getElementById('loginModal').addEventListener('click', function(e) {
            if (e.target === this) closeLoginModal();
        });

        const savedCart = localStorage.getItem('cart');
        if (savedCart) window.cart = JSON.parse(savedCart);
        updateCartCount();
        fetchProductsFromWordPress().then(() => {
            renderCategories();
            renderProducts();
        });
    </script>
</body>
</html>
